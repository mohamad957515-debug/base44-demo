services:
  web:
    image: node:22-alpine
    working_dir: /workspace
    restart: on-failure
    command:
      - sh
      - -ec
      - |
        npm ci --no-audit --no-fund
        exec npm run dev -- --host 0.0.0.0 --port 3000
    environment:
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "3000:3000"
    volumes:
      - "${BASE44_PROJECT_ROOT:-.}:/workspace"
      - node_modules:/workspace/node_modules
    labels:
      base44.project: "Tabatabaei Atelier"
      base44.kind: "web"
      base44.port: "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 180s

volumes:
  node_modules:
